name: Recordatorios de Asistencia ValEnglish

on:
  schedule:
    # Todas las horas en UTC. España es UTC+1 (CET) en invierno, UTC+2 (CEST) en verano.
    - cron: '0 8 26 10 *'  # Lunes 26 oct 2026 → 9:00h España (CET)
    - cron: '0 8 16 11 *'  # Lunes 16 nov 2026 → 9:00h España (CET)
    - cron: '0 8 7 12 *'   # Lunes 7 dic 2026  → 9:00h España (CET)
    - cron: '0 8 1 2 *'    # Lunes 1 feb 2027  → 9:00h España (CET)
    - cron: '0 8 1 3 *'    # Lunes 1 mar 2027  → 9:00h España (CET)
    - cron: '0 7 5 4 *'    # Lunes 5 abr 2027  → 9:00h España (CEST)
    - cron: '0 7 3 5 *'    # Lunes 3 may 2027  → 9:00h España (CEST)
    - cron: '0 7 7 6 *'    # Lunes 7 jun 2027  → 9:00h España (CEST)

  # Permite lanzarlo manualmente desde la interfaz de GitHub si hace falta
  workflow_dispatch:

jobs:
  enviar-recordatorio:
    runs-on: ubuntu-latest

    steps:
      - name: Calcular mes a revisar
        id: fecha
        run: |
          MONTH=$(date +%-m)
          YEAR=$(date +%Y)
          PREV_MONTH=$((MONTH - 1))
          PREV_YEAR=$YEAR
          if [ $PREV_MONTH -eq 0 ]; then
            PREV_MONTH=12
            PREV_YEAR=$((YEAR - 1))
          fi
          MESES=("" "enero" "febrero" "marzo" "abril" "mayo" "junio" "julio" "agosto" "septiembre" "octubre" "noviembre" "diciembre")
          echo "mes=${MESES[$PREV_MONTH]} $PREV_YEAR" >> $GITHUB_OUTPUT

      - name: Enviar recordatorio a Slack
        run: |
          curl -s -X POST \
            -H 'Content-type: application/json' \
            --data "{
              \"text\": \"📊 *Recordatorio mensual — Control de Asistencia ValEnglish*\n\nYa está disponible el Excel de reportes de Zoom de *${{ steps.fecha.outputs.mes }}*. Es el momento de revisar la asistencia de los estudiantes.\n\nPor favor, sube el archivo a la herramienta y comparte el resumen con el equipo. 🙌\"
            }" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
